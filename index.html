<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>丙午馬年．大老二記分所</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    body {
      background-color: #050000;
      color: #fff;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "SF Pro Display", "PingFang TC", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* iOS 26 呼吸感與流體動畫 */
    @keyframes breathe {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.15; }
      50% { transform: scale(1.05) translate(-10px, 10px); opacity: 0.25; }
    }

    @keyframes floatGold {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    /* 燈籠鐘擺搖曳動畫 */
    @keyframes swing {
      0% { transform: rotate(-4deg); }
      50% { transform: rotate(4deg); }
      100% { transform: rotate(-4deg); }
    }

    .animate-breathe {
      animation: breathe 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .lantern-left {
      transform-origin: 50% 0%;
      animation: swing 7s ease-in-out infinite;
    }

    .lantern-right {
      transform-origin: 50% 0%;
      animation: swing 5.5s ease-in-out infinite reverse;
    }

    /* 玻璃擬態與紅包質感 */
    .glass-envelope {
      background: linear-gradient(145deg, rgba(153, 27, 27, 0.8) 0%, rgba(69, 10, 10, 0.9) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(251, 191, 36, 0.3);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .glass-envelope-active {
      background: linear-gradient(145deg, rgba(217, 119, 6, 0.9) 0%, rgba(153, 27, 27, 0.9) 100%);
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 0 20px rgba(217, 119, 6, 0.3);
    }

    .glass-dock {
      background: rgba(20, 0, 0, 0.65);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .btn-press:active {
      transform: scale(0.94);
      filter: brightness(0.9);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-scroll::-webkit-scrollbar { display: none; }
    .custom-scroll { scrollbar-width: none; }

    /* 中國風漸層字體 */
    .text-gold-gradient {
      background: linear-gradient(to right, #FDE047, #F59E0B, #D97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // SVG 圖標庫
    const Icon = ({ name, className = "w-6 h-6" }) => {
      const svgs = {
        trophy: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
        history: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        play: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
        minus: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        plus: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
        info: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>,
        share: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
        coin: <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
      };
      return svgs[name] || null;
    };

    // 獨立的燈籠 SVG 組件
    const Lantern = ({ className }) => (
      <div className={`absolute pointer-events-none z-0 ${className}`}>
        <svg viewBox="0 0 100 240" className="w-full h-full drop-shadow-[0_12px_20px_rgba(220,38,38,0.5)]">
          {/* 上方吊線 */}
          <line x1="50" y1="0" x2="50" y2="35" stroke="#FBBF24" strokeWidth="2" opacity="0.8"/>
          
          {/* 燈籠上蓋 */}
          <path d="M35 35 L 65 35 L 70 42 L 30 42 Z" fill="#F59E0B" />
          <rect x="42" y="32" width="16" height="3" fill="#D97706" />

          {/* 燈籠主體 (透出微光) */}
          <path d="M20 42 Q -5 95 20 148 L 80 148 Q 105 95 80 42 Z" fill="url(#lanternRedGrad)"/>
          
          {/* 燈籠金線骨架 */}
          <path d="M35 42 Q 20 95 35 148" stroke="#FDE047" strokeWidth="1" fill="none" opacity="0.6"/>
          <path d="M50 42 L 50 148" stroke="#FDE047" strokeWidth="1" fill="none" opacity="0.6"/>
          <path d="M65 42 Q 80 95 65 148" stroke="#FDE047" strokeWidth="1" fill="none" opacity="0.6"/>

          {/* 燈籠下蓋 */}
          <path d="M30 148 L 70 148 L 65 155 L 35 155 Z" fill="#F59E0B" />
          <rect x="42" y="155" width="16" height="4" fill="#B45309" />

          {/* 底部流蘇 */}
          <line x1="45" y1="159" x2="40" y2="210" stroke="#EF4444" strokeWidth="1.5" opacity="0.9"/>
          <line x1="50" y1="159" x2="50" y2="220" stroke="#EF4444" strokeWidth="1.5" opacity="0.9"/>
          <line x1="55" y1="159" x2="60" y2="210" stroke="#EF4444" strokeWidth="1.5" opacity="0.9"/>

          {/* 漸層定義 */}
          <defs>
            <linearGradient id="lanternRedGrad" x1="0" y1="42" x2="100" y2="148" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stopColor="#ef4444" />
              <stop offset="50%" stopColor="#b91c1c" />
              <stop offset="100%" stopColor="#450a0a" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    );

    // 背景動畫系統
    const AtmosphereBackground = () => {
      // 隨機產生金箔粒子的初始位置與延遲
      const particles = useMemo(() => Array.from({ length: 15 }).map((_, i) => ({
        id: i,
        left: `${Math.random() * 100}%`,
        bottom: `${Math.random() * 20 - 10}%`,
        delay: `${Math.random() * 4}s`,
        duration: `${Math.random() * 3 + 4}s`,
        size: `${Math.random() * 4 + 2}px`
      })), []);

      return (
        <div className="absolute inset-0 z-0 pointer-events-none overflow-hidden">
          {/* 深度暗紅徑向漸層 */}
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,_rgba(127,29,29,0.4)_0%,_rgba(0,0,0,1)_70%)]"></div>
          
          {/* 左側大燈籠 */}
          <Lantern className="left-[-15px] top-[-20px] w-40 opacity-90 lantern-left" />
          
          {/* 右側小燈籠 */}
          <Lantern className="right-[-5px] top-[-10px] w-28 opacity-70 lantern-right" />

          {/* 呼吸的馬年書法浮水印 */}
          <div className="absolute top-[15%] -right-[15%] w-[120%] opacity-[0.08] animate-breathe text-red-500">
            <svg viewBox="0 0 200 200" fill="currentColor">
              <path d="M50,40 Q70,30 90,40 Q100,50 90,70 Q70,90 50,80 Z" opacity="0.3"/>
              <path d="M100,20 Q130,10 160,30 Q180,60 150,90 Q120,110 90,80 Z" opacity="0.5"/>
              <path d="M70,100 Q120,90 150,130 Q170,170 120,180 Q80,190 50,150 Z" opacity="0.7"/>
              <text x="100" y="140" fontSize="80" fontFamily="STKaiti, serif" textAnchor="middle" fill="currentColor" opacity="0.8">馬</text>
            </svg>
          </div>

          {/* 金箔微粒上升動畫 */}
          {particles.map(p => (
            <div 
              key={p.id}
              className="absolute bg-amber-300 rounded-full shadow-[0_0_8px_rgba(253,230,138,0.8)]"
              style={{
                left: p.left,
                bottom: p.bottom,
                width: p.size,
                height: p.size,
                animation: `floatGold ${p.duration} ease-in infinite`,
                animationDelay: p.delay
              }}
            />
          ))}
        </div>
      );
    };

    const App = () => {
      const INITIAL_PLAYERS = [
        { id: 'p1', name: '爸爸', score: 0 },
        { id: 'p2', name: '媽媽', score: 0 },
        { id: 'p3', name: '哥哥', score: 0 },
        { id: 'p4', name: '妹妹', score: 0 },
      ];

      const [players, setPlayers] = useState(INITIAL_PLAYERS);
      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState('play');
      const [currentCards, setCurrentCards] = useState({ p1: 0, p2: 0, p3: 0, p4: 0 });
      const [twoCounts, setTwoCounts] = useState({ p1: 0, p2: 0, p3: 0, p4: 0 });
      const [winnerTwoCount, setWinnerTwoCount] = useState(0);
      const [toast, setToast] = useState(null);
      const [showRules, setShowRules] = useState(false);

      const showToast = (msg, type = 'normal') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 資料匯入與讀取
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const encodedData = params.get('data');
        if (encodedData) {
          try {
            const decoded = JSON.parse(atob(decodeURIComponent(encodedData)));
            if (window.confirm(`發現匯入資料（時間：${decoded.time}），要覆蓋目前牌局嗎？`)) {
              setPlayers(decoded.players);
              setHistory(decoded.history);
              window.history.replaceState({}, document.title, window.location.pathname);
            }
          } catch (e) { showToast("資料解析失敗", "error"); }
        } else {
          const savedP = localStorage.getItem('big2_players_v2');
          const savedH = localStorage.getItem('big2_history_v2');
          if (savedP) setPlayers(JSON.parse(savedP));
          if (savedH) setHistory(JSON.parse(savedH));
        }
      }, []);

      useEffect(() => {
        localStorage.setItem('big2_players_v2', JSON.stringify(players));
        localStorage.setItem('big2_history_v2', JSON.stringify(history));
      }, [players, history]);

      const handleShare = () => {
        const data = { players, history, time: new Date().toLocaleString() };
        const url = `${window.location.origin}${window.location.pathname}?data=${encodeURIComponent(btoa(JSON.stringify(data)))}`;
        
        const textArea = document.createElement("textarea");
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast("記帳連結已複製，去群組討債吧！", "success");
        } catch (err) {}
        document.body.removeChild(textArea);
      };

      const changeCard = (id, delta) => {
        setCurrentCards(prev => {
          const newVal = Math.max(0, Math.min(13, prev[id] + delta));
          if (newVal === 0) setTwoCounts(p => ({ ...p, [id]: 0 }));
          return { ...prev, [id]: newVal };
        });
      };

      const toggleTwo = (id) => {
        if (currentCards[id] === 0) return;
        setTwoCounts(prev => ({ ...prev, [id]: (prev[id] + 1) % 5 }));
      };

      const calculate = () => {
        const pIds = ['p1', 'p2', 'p3', 'p4'];
        const winners = pIds.filter(id => currentCards[id] === 0);
        
        if (winners.length !== 1) {
          showToast("規矩不對喔！必須剛好有一人脫手（剩 0 張）才能結算。", "error");
          return;
        }

        const winnerId = winners[0];
        let totalPot = 0;
        const roundScores = {};

        pIds.forEach(id => {
          if (id === winnerId) {
            roundScores[id] = 0;
          } else {
            let p = currentCards[id];
            if (p >= 8) p *= 2; 
            if (twoCounts[id] > 0) p *= Math.pow(2, twoCounts[id]); 
            if (winnerTwoCount > 0) p *= Math.pow(2, winnerTwoCount); 
            
            roundScores[id] = -p;
            totalPot += p;
          }
        });

        roundScores[winnerId] = totalPot;

        setPlayers(prev => prev.map(p => ({ ...p, score: p.score + roundScores[p.id] })));
        setHistory([{
          id: Date.now(),
          time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
          scores: roundScores,
          isExtreme: winnerTwoCount > 0
        }, ...history]);

        setCurrentCards({ p1: 0, p2: 0, p3: 0, p4: 0 });
        setTwoCounts({ p1: 0, p2: 0, p3: 0, p4: 0 });
        setWinnerTwoCount(0);
        showToast("結算完成，帳目已更新", "success");
      };

      const undo = () => {
        if (!history.length || !window.confirm("確定要收回剛剛那局嗎？")) return;
        const [last, ...rest] = history;
        setPlayers(prev => prev.map(p => ({ ...p, score: p.score - last.scores[p.id] })));
        setHistory(rest);
      };

      return (
        <div className="w-full h-[100dvh] relative flex flex-col mx-auto max-w-md shadow-2xl overflow-hidden bg-black selection:bg-red-500/30">
          <AtmosphereBackground />

          {/* 頂部通知浮窗 (Toast) */}
          <div className={`absolute top-[var(--safe-top)] left-4 right-4 z-50 transition-all duration-400 transform ${toast ? 'translate-y-4 opacity-100' : '-translate-y-10 opacity-0 pointer-events-none'}`}>
            <div className={`px-4 py-3 rounded-2xl text-sm font-medium shadow-2xl backdrop-blur-xl border ${toast && toast.type === 'error' ? 'bg-red-950/80 border-red-500/50 text-red-100' : 'bg-green-950/80 border-green-500/50 text-green-100'} flex items-center justify-center`}>
              {toast && toast.msg}
            </div>
          </div>

          {/* Header 區塊：中國風標題 */}
          <header className="pt-[calc(var(--safe-top)+1rem)] pb-4 px-6 relative z-10 pointer-events-none">
            <div className="flex justify-between items-end pointer-events-auto">
              <div>
                <p className="text-red-400 text-[10px] font-bold tracking-[0.3em] mb-1">歲次丙午．迎春接福</p>
                <h1 className="text-2xl font-black text-gold-gradient tracking-widest drop-shadow-md font-serif">
                  大老二記分所
                </h1>
              </div>
              <div className="flex gap-3">
                <button onClick={() => setShowRules(true)} className="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center btn-press text-white/70">
                  <Icon name="info" className="w-5 h-5" />
                </button>
                <button onClick={handleShare} className="w-9 h-9 rounded-full bg-white/5 border border-white/10 flex items-center justify-center btn-press text-white/70">
                  <Icon name="share" className="w-5 h-5" />
                </button>
              </div>
            </div>
          </header>

          {/* 核心內容區 (不需捲動的完美配比) */}
          <main className="flex-1 relative z-10 flex flex-col px-5 pb-[calc(80px+var(--safe-bottom))]">
            
            {/* --- 上桌記分介面 --- */}
            <div className={`flex-1 flex flex-col transition-opacity duration-300 ${activeTab === 'play' ? 'opacity-100 relative' : 'opacity-0 absolute inset-0 pointer-events-none'}`}>
              
              <div className="flex justify-between items-center mb-2 px-1">
                <span className="text-xs text-white/50 tracking-wider">點擊加減記錄剩餘牌數</span>
                <span className="text-[10px] text-amber-500/70 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">8張以上自動翻倍</span>
              </div>

              {/* 玩家紅包列 */}
              <div className="flex flex-col gap-3">
                {INITIAL_PLAYERS.map(base => {
                  const id = base.id;
                  const p = players.find(x => x.id === id);
                  const isWinner = currentCards[id] === 0;
                  
                  return (
                    <div key={id} className={`glass-envelope rounded-2xl p-3 flex items-center justify-between transition-all duration-300 ${twoCounts[id] > 0 ? 'glass-envelope-active' : ''}`}>
                      
                      <div className="flex flex-col gap-2 pl-1">
                        <span className="text-[15px] font-bold tracking-widest">{p.name}</span>
                        
                        <button 
                          onClick={() => toggleTwo(id)}
                          disabled={isWinner}
                          className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-[11px] font-medium transition-colors border ${isWinner ? 'opacity-30 cursor-not-allowed border-transparent bg-black/20' : twoCounts[id] > 0 ? 'bg-amber-500/20 text-amber-200 border-amber-400/50 shadow-[0_0_10px_rgba(251,191,36,0.2)]' : 'bg-black/30 text-white/40 border-white/5 btn-press'}`}
                        >
                          <Icon name="coin" className="w-3.5 h-3.5" />
                          {isWinner ? '順利脫手' : twoCounts[id] > 0 ? `扣住老二 × ${twoCounts[id]}` : '手無老二'}
                        </button>
                      </div>

                      <div className="flex items-center gap-2 bg-black/40 p-1.5 rounded-[14px] border border-white/5 shadow-inner">
                        <button onClick={() => changeCard(id, -1)} className="w-10 h-10 rounded-xl bg-white/5 btn-press flex items-center justify-center text-white/70">
                          <Icon name="minus" />
                        </button>
                        <div className="w-8 text-center text-2xl font-mono font-bold tracking-tighter tabular-nums">
                          {currentCards[id]}
                        </div>
                        <button onClick={() => changeCard(id, 1)} className="w-10 h-10 rounded-xl bg-white/5 btn-press flex items-center justify-center text-white/70">
                          <Icon name="plus" />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* 底部大招與結算 */}
              <div className="mt-auto pt-4 space-y-3">
                <button 
                  onClick={() => setWinnerTwoCount(v => (v + 1) % 5)}
                  className={`w-full py-3.5 rounded-[14px] text-xs font-medium transition-all border flex items-center justify-center gap-2 btn-press ${winnerTwoCount > 0 ? 'bg-gradient-to-r from-amber-600/30 to-red-600/30 text-amber-200 border-amber-500/50' : 'bg-white/5 text-white/50 border-white/5'}`}
                >
                  <Icon name="play" className="w-4 h-4" />
                  {winnerTwoCount > 0 ? `大招：贏家老二脫手 × ${winnerTwoCount} (全場慘遭翻倍)` : '贏家以一般牌型漂亮脫手'}
                </button>
                
                <button 
                  onClick={calculate}
                  className="w-full relative overflow-hidden group py-4 rounded-2xl font-bold text-lg text-white shadow-[0_0_30px_rgba(220,38,38,0.3)] btn-press"
                >
                  <div className="absolute inset-0 bg-gradient-to-r from-red-700 via-red-600 to-red-700 bg-[length:200%_auto] animate-[shimmer_3s_linear_infinite]"></div>
                  <div className="absolute inset-0 bg-black/10 opacity-0 group-active:opacity-100 transition-opacity"></div>
                  <span className="relative z-10 tracking-widest">封盤收錢</span>
                </button>
              </div>
            </div>

            {/* --- 戰報與明細介面 (共用結構，獨立捲動) --- */}
            {activeTab !== 'play' && (
              <div className="absolute inset-0 top-0 bottom-[calc(80px+var(--safe-bottom))] px-5 pt-2 overflow-y-auto custom-scroll animate-in fade-in duration-300">
                
                {activeTab === 'scores' && (
                  <div className="space-y-3">
                    <p className="text-xs text-white/40 tracking-widest text-center mb-4">累積戰績排行榜</p>
                    {[...players].sort((a, b) => b.score - a.score).map((p, idx) => (
                      <div key={p.id} className="bg-white/5 border border-white/10 rounded-2xl p-4 flex items-center justify-between backdrop-blur-md">
                        <div className="flex items-center gap-4">
                          <span className={`w-6 text-center font-bold ${idx === 0 ? 'text-amber-400 text-xl' : 'text-white/30'}`}>
                            {idx === 0 ? '#' : idx + 1}
                          </span>
                          <span className="text-base tracking-widest">{p.name}</span>
                        </div>
                        <span className={`text-2xl font-mono font-bold ${p.score > 0 ? 'text-green-400' : p.score < 0 ? 'text-red-400' : 'text-white/30'}`}>
                          {p.score > 0 ? `+${p.score}` : p.score}
                        </span>
                      </div>
                    ))}
                    <div className="pt-6 text-center">
                      <button onClick={() => window.confirm("確定重新洗牌清算？") && setPlayers(INITIAL_PLAYERS) || setHistory([])} className="text-sm text-red-400/60 hover:text-red-400 tracking-widest">
                        重新洗牌清算
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === 'history' && (
                  <div className="space-y-3">
                    <div className="flex justify-between items-center mb-4 px-1">
                      <p className="text-xs text-white/40 tracking-widest">局數明細紀錄</p>
                      {history.length > 0 && (
                        <button onClick={undo} className="text-xs text-amber-500/80 hover:text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                          撤回上一局
                        </button>
                      )}
                    </div>
                    
                    {!history.length ? (
                      <div className="py-20 text-center text-white/20 text-sm tracking-widest">新春開局，桌面上還乾乾淨淨的。</div>
                    ) : (
                      history.map((rec, i) => (
                        <div key={rec.id} className="bg-white/5 border border-white/10 rounded-2xl p-4 backdrop-blur-md">
                          <div className="flex justify-between items-center mb-3 pb-2 border-b border-white/10">
                            <span className="text-xs text-white/40">{rec.time}</span>
                            {rec.isExtreme && <span className="text-[10px] bg-red-500/20 text-red-300 px-2 py-0.5 rounded border border-red-500/30 tracking-wider">老二大招加成</span>}
                          </div>
                          <div className="grid grid-cols-4 gap-2 text-center">
                            {INITIAL_PLAYERS.map(p => {
                              const s = rec.scores[p.id];
                              return (
                                <div key={p.id}>
                                  <div className="text-[10px] text-white/40 mb-1">{p.name}</div>
                                  <div className={`text-sm font-mono font-bold ${s > 0 ? 'text-green-400' : s < 0 ? 'text-red-400' : 'text-white/20'}`}>
                                    {s > 0 ? `+${s}` : s}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 底部 iOS 擬態導航列 (Dock) */}
          <nav className="absolute bottom-0 w-full glass-dock pb-[var(--safe-bottom)] pt-2 px-6 z-20">
            <div className="flex justify-between items-center max-w-[280px] mx-auto">
              <button onClick={() => setActiveTab('scores')} className={`flex flex-col items-center gap-1.5 w-16 transition-all duration-300 btn-press ${activeTab === 'scores' ? 'text-amber-400 scale-105' : 'text-white/40'}`}>
                <Icon name="trophy" className="w-6 h-6" />
                <span className="text-[10px] font-medium tracking-widest">總戰報</span>
              </button>
              
              <button onClick={() => setActiveTab('play')} className={`flex flex-col items-center gap-1.5 w-16 transition-all duration-300 btn-press ${activeTab === 'play' ? 'text-red-400 scale-105' : 'text-white/40'}`}>
                <Icon name="play" className="w-7 h-7" />
                <span className="text-[10px] font-medium tracking-widest">記分</span>
              </button>

              <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1.5 w-16 transition-all duration-300 btn-press ${activeTab === 'history' ? 'text-amber-400 scale-105' : 'text-white/40'}`}>
                <Icon name="history" className="w-6 h-6" />
                <span className="text-[10px] font-medium tracking-widest">明細</span>
              </button>
            </div>
          </nav>

          {/* 規矩解說 Modal (全螢幕覆蓋) */}
          {showRules && (
            <div className="absolute inset-0 z-[100] flex items-end sm:items-center justify-center animate-in fade-in duration-200">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setShowRules(false)}></div>
              <div className="relative w-full sm:w-11/12 bg-[#1a0f0f] border border-red-900/30 sm:rounded-[32px] rounded-t-[32px] p-6 pb-[calc(24px+var(--safe-bottom))] shadow-2xl slide-in-from-bottom-10">
                <div className="w-12 h-1 bg-white/10 rounded-full mx-auto mb-6 sm:hidden"></div>
                
                <h3 className="text-xl font-black text-gold-gradient tracking-widest mb-6 text-center">江湖規矩</h3>
                
                <div className="space-y-5 text-sm leading-relaxed text-white/70 px-2">
                  <p><strong className="text-white tracking-widest">基本盤面</strong><br/>剩餘 1-7 張按原牌數扣分。若滿手爛牌剩餘 <span className="text-amber-400">8 張以上（含）</span>，直接翻倍計算。</p>
                  <p><strong className="text-white tracking-widest">手握老二</strong><br/>輸家若手裡還扣著老二，每 1 張翻 1 倍。例如：剩 2 張老二就是 <span className="text-amber-400">×4 倍</span>。</p>
                  <div className="bg-red-950/40 p-4 rounded-xl border border-red-900/50">
                    <strong className="text-red-400 tracking-widest">大招：老二結尾</strong><br/>
                    贏家若打出老二漂亮脫手，全場輸家總分 <span className="text-red-400">全部強制翻倍</span>。這招殺傷力極大，收錢時請當心和氣。
                  </div>
                </div>

                <button onClick={() => setShowRules(false)} className="w-full mt-8 bg-white/5 hover:bg-white/10 border border-white/10 py-3.5 rounded-xl text-white tracking-widest transition-colors btn-press">
                  了解，退下吧
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
